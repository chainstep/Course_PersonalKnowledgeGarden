[project]
name = "knowledge-garden"
version = "0.1.0"
description = "Local-first personal knowledge garden"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "mcp[cli]>=1.2",
  "fastmcp>=2.0",
  "pydantic>=2.7",
  "pydantic-ai>=0.0.14",
  "pymupdf>=1.24",
  "sentence-transformers>=3.0",
  "sqlite-vec>=0.1.6",
]

[project.scripts]
kg = "knowledge_garden.cli:main"
kg-mcp = "knowledge_garden.mcp_cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "pyright>=1.1", "jsonschema>=4.20"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "FURB162"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
